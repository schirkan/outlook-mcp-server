name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    if: github.event.created && !github.event.deleted
    name: Build, test and publish Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      OUTLOOKMCP_RUN_LIVE_TESTS: '0'
      PROJECT: src/OutlookMcpServer/OutlookMcpServer.csproj

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid release tag: $env:GITHUB_REF_NAME"
          }
          "VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV

      - name: Build and test without an Outlook profile
        run: dotnet test OutlookMcpServer.sln -c Release --nologo

      - name: Restore Windows x64 release
        run: dotnet restore $env:PROJECT -r win-x64 -p:PublishProfile=minimal -p:Configuration=Release -p:Version=$env:VERSION

      - name: Publish self-contained Windows x64 binary
        run: dotnet publish $env:PROJECT -c Release -r win-x64 --no-restore -p:PublishProfile=minimal -p:Version=$env:VERSION -o publish --nologo

      - name: Verify and package release
        shell: pwsh
        run: |
          $exe = Get-Item publish/OutlookMcpServer.exe
          if (($exe.VersionInfo.ProductVersion -split '\+', 2)[0] -ne $env:VERSION) {
            throw "Unexpected binary version: $($exe.VersionInfo.ProductVersion)"
          }
          Get-Item publish/appsettings.json | Out-Null
          $zip = 'outlook-mcp-server.zip'
          Compress-Archive -LiteralPath publish/OutlookMcpServer.exe,publish/appsettings.json -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA-256 ($zip): $hash" | Set-Content release-notes.md

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content release-notes.md -Raw
          gh release create $env:GITHUB_REF_NAME outlook-mcp-server.zip `
            --repo $env:GITHUB_REPOSITORY --verify-tag `
            --title "Outlook MCP Server $env:GITHUB_REF_NAME" `
            --generate-notes --notes $notes
